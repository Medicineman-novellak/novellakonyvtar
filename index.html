.reader .book{perspective:2600px}

@media(max-width:650px){.wind-sheet{left:0;width:100%}.wind-face-inner{padding:30px 34px 22px}.wind-face-inner .page-content{font-size:16px}}

/* Mesekönyv: egyetlen, folyamatosan átforduló papírlap */
.storybook-sheet{position:absolute;top:0;bottom:0;left:50%;width:50%;z-index:9;pointer-events:none;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 9px 8px rgba(45,24,10,.28))}

 .reader .page-content{font-size:clamp(13px,1.12vw,16px);line-height:1.63}.reader .page-content h1{margin:8px 0 18px;font-size:clamp(19px,2vw,26px)} .reader .page-content .epigraph{font-size:15px;line-height:1.65;font-style:italic;text-indent:0;text-align:left;margin-top:12px}

></g><g aria-label="A találkozás" class="spine" data-i="3" role="button" tabindex="0"><polygon class="band" points="821.5,49.0 828.5,49.0 828.5,53.0 821.5,53.0"></polygon><polygon class="hit" points="813,46 837,46 837,173 813,173"></polygon></g><g aria-label="Csend a kertben" class="spine" data-i="4" role="button" tabindex="0"><polygon class="band" points="1247.0,60.0 1254.0,60.0 1254.0,64.0 1247.0,64.0"></polygon><polygon class="hit" points="1240,57 1261,57 1261,174 1240,174"></polygon></g><g aria-label="A másik part" class="spine" data-i="5" role="button" tabindex="0"><polygon class="band" points="1411.5,61.0 1418.5,61.0 1418.5,65.0 1411.5,65.0"></polygon><polygon class="hit" points="1406,58 1424,58 1424,174 1406,174"></polygon></g><g aria-label="Az elfelejtett név" class="spine" data-i="6" role="button" tabindex="0"><polygon class="band" points="665.0,241.0 672.0,241.0 672.0,245.0 665.0,245.0"></polygon><polygon class="hit" points="659,238 678,238 678,342 659,342"></polygon></g><g aria-label="A kulcs" class="spine" data-i="7" role="button" tabindex="0"><polygon class="band" points="896.0,212.0 903.0,212.0 903.0,216.0 896.0,216.0"></polygon><polygon class="hit" points="891,209 908,209 908,341 891,341"></polygon></g></svg></main><div class="tip" id="tip"></div><section aria-label="Novella olvasása" aria-modal="true" class="reader" id="reader" role="dialog" style="--desk-scene:url('kep-2.png')"><button aria-label="Kilépés az olvasóból" class="exit" id="exit" type="button">✕ Kilépés</button><div class="desk"><div class="book" id="openBook"><div class="page" id="leftPage"><div class="page-content" id="leftContent"></div><div class="page-number" id="leftNumber"></div></div><div class="page" id="rightPage"><div class="page-content" id="rightContent"></div><div class="page-number" id="rightNumber"></div></div><button aria-label="Előző oldalpár" class="page-edge prev" id="edgePrev">‹</button><button aria-label="Következő oldalpár" class="page-edge next" id="edgeNext">›</button></div><div class="buttons"><button id="prev" type="button">← Előző</button><span aria-live="polite" class="note" id="pageStatus">1–2. oldal</span><button id="next" type="button">Következő →</button><button id="close" type="button">Becsukom a könyvet ↩</button></div></div></section><script>
const titles=["Mandula vagy mogyoró?", "A régi óra", "Egy nyári délután", "A találkozás", "Csend a kertben", "A másik part", "Az elfelejtett név", "A kulcs"];
const tip=document.getElementById('tip'),reader=document.getElementById('reader'),book=document.getElementById('openBook');
const left=document.getElementById('leftContent'),right=document.getElementById('rightContent');
let last=null,spread=0,current=0,turning=false;
const samplePages=["<div class=\"ornament\">❦</div><h1>Mandula vagy mogyoró?</h1><p class=\"epigraph\">„A logikai módszereket tárgyaló tudósok azt a benyomást teszik reám, mint az a szónok, aki ékesszólását a beszédcentrumok, a hangképzés és a gége beidegzésének tanulmányozásával akarná fejleszteni. Mint hogyha ezen bonc- és élettani folyamatok ismerete pótolhatná a hiányzó tehetséget, vagy akár megjavíthatná azt, amivel bírunk!”</p><p class=\"attribution\">Santiago Ramón y Cajal</p>", "<p>Hangzott el az első kérdés. Mondjuk baromira nem mindegy, ki kérdezi. A sebész vagy a cukrász. Sebésznél a mogyoró mindenképpen rossz válasznak tűnik. Nem tudok olyan testrészemről, amit mogyorónak hívnak, bár a herék általánosan használt szleng szinonimája lehet mogyoró, de nőként nincs olyanom. És ha ő tud valamit, amit én nem? Akkor valószínűleg jobb lett volna otthon maradnom. Cukrásznál egyszerűbb. Mogyoró. Bár ez sem teljesen igaz. Attól függ, miben, darabolt, vágott, őrölt, pirított?</p>", "<p>Mogyoró, mondtam ki végül kicsit félénken. Ühüm, bólintott rá. Nem úgy, mint aki örül neki. Inkább úgy, mint aki tudomásul vett valamit. Nem szeretem, amikor az emberek így bólintanak. Fura jelentése van számomra. Az orvosok szoktak. Meg az autószerelők. Mindkettő után súlyosan zsebbe kell nyúlni. De aztán ő nyúlt a zsebébe váratlanul és letett elém egy kis dobozt.</p>", "<p>Ezt tegnap csináltam. Na, remek, tehát egyik sem. Ezek szerint cukrász és nem orvos. Bárcsak figyeltem volna tegnap, de munka közben hívott Éva, és fél perc alatt eldarálta, hogy orvos. Meg hogy negyvenkettő, elvált, nincs gyereke, magas, normális és „szerintem neked való”. Éva szerint nekem mindenki való, aki elmúlt harmincöt, rendelkezik saját fogakkal és nem lakik az anyjával. Az évek múlásával látványosan lejjebb adta az igényeimet. A férfi közben engem nézett.</p>", "<p>Várta, hogy megkóstoljam. Macaron volt. Vékonyan csorgatott, csokoládés csíkok a tetején, mogyorós belső, szabályosan kerek, fényes tükröződő felület. Túl szabályosan nézett ki, talán kényszeresen tökéletesen. Egyszer én is próbáltam macaront sütni. A tepsin úgy néztek ki, mint egy súlyos bőrbetegség különböző stádiumai. Beleharaptam. Jó? kérdezte pár másodperc után. Naaon, vágtam rá tele szájjal. Tényleg nagyon jó volt. Kemény és puha egyszerre, egy intenzív ízorgiával.</p>", "<p>Várt pár másodpercet és folytatta. Szeretek precízen dolgozni, mondta és elmosolyodott. De nem kellett volna. A mondat előtt egész bizalomgerjesztő volt, de most, furán bizarr volt tőle. Persze, miért ne lenne fura? Orvos. azok nem mosolyognak, mert nagyon komolyak. Milyen területen dolgozol? kérdeztem érdeklődve. Elég speciális, jött egy homályos válasz. Ezt az orvosok biztosan azért mondják, hogy az ember ne kérdezzen tovább. Vagy lehet, hogy pont azért, hogy kérdezzen.</p>", "<p>Belementem a játékba és kérdeztem. Sebészet? Elmosolyodott, szemében megcsillant az érdeklődés és kicsit a büszkeség is. Valami olyasmi, felelte homályosan. Kezdtem megelégelni, nem vagyok gondolatolvasó. Valami olyasmi. Mi az, hogy valami olyasmi? Vagy sebész valaki, vagy nem. Senki nem mondja, hogy könyvelő vagyok, valami olyasmi. Bár Éva egyszer összehozott egy férfival, aki azt mondta, a pénzügyi szektorban dolgozik, aztán kiderült, hogy sportfogadási tippeket árul Telegramon.</p><p>Szereted? kérdeztem. Ó, nagyon, felelte lelkesen. Kézzel szeretek dolgozni, folytatta.</p>", "<p>Ránéztem a kezére. Hosszú ujjak, rövid körmök, semmi gyűrű. Szép kéz, talán kicsit fehérebb az átlagnál. Sebészkeze van, gondoltam, bár fogalmam sincs, milyen a sebész keze. Nyilván nem olyan, mint egy kőművesé. Remélhetőleg nem remeg. Az övé nem remegett. Tovább puhatolóztam. Nem monoton?</p>", "<p>Kifejezetten állíthatom, hogy nem. Nincs két egyforma eset. válaszolta immár kicsit konkrétabban, de még mindig képlékenyen. Ránéztem és kilövelt a számból a homályos célzás. Gondolom idővel kialakul a rutin, kérdeztem. A válaszra nem kellett sokat várni. Tudod, hol kell kezdeni, hogyan érdemes hozzáférni. Utána már sokkal könnyebb. A fenébe, ez mit jelenthet. Letettem a macaront. Nem is tudom, miért.</p><p>Hiszen orvos. Az orvosok hozzáférnek dolgokhoz. Ez a munkájuk. Ugyan már lazíts egy kicsit, gondoltam.</p>", "<p>Megpróbáltam használható információt kihúzni belőle, kerestem egy konkrétabb kérdést. És bírod a vért? Felkacagott. Muszáj, bár sokkal kevesebb folyik szét, mint a filmekben, válaszolta vidáman. Jó. Sebész. Megnyugodtam. Mondjuk nem teljesen értem, mitől nyugodtam meg attól, hogy egy idegen férfi közölte velem, hogy jól bírja a vért, de mindegy is.</p>", "<p>Engem tulajdonképpen inkább, a belső dolgok érdekelnek, folytatta mintha eddig nem lett volna így is elég bizarr ez a beszélgetés. Na jó. Kortyoltam a borból egy nagyobbat. Éva azt mondta, normális. Ezt most megpróbáltam felidézni pontosan. Azt mondta, teljesen normális, vagy csak azt, hogy normális? Nem mindegy. A teljesen normális még Évától is minimum fenntartásokkal elfogadható. A normális egyszerű általános adatközlés csak információtartalom nélkül, némi elfogultsággal párosítva.</p>", "<p>Megfordult a kérdezés, most én kerültem terítékre. És te - kérdezte bizonytalanul - szereted, amit csinálsz? Beszéltem neki a munkámról. Figyelt. Tényleg figyelt. Nem nézett közben a telefonjára, nem próbálta visszafordítani magára a beszélgetést, és egyszer sem mondta azt, hogy én nagyon spirituális ember vagyok, meg jó hogy önmegvalósítasz és hogy igazán erős nő vagy. Ez jelentős előrelépés volt az előző három randihoz képest, lehet, hogy mégis normális? Talán Évának igaza van. Rendeltünk még egy pohár bort. Aztán valahogy megint a munkájáról beszéltünk.</p>", "<p>A legnehezebb – mondta – amikor már nagyon rossz állapotban kerül hozzánk. Elhiszem, vágtam rá azonnal, mert végülis láttam a vészhelyzet összes részét, erről van elképzelésem. Olyankor néha órákig dolgozunk rajta folytatta a mondanivalóját. Na ácsi, a Vészhelyzetben gyorsabb volt fél óra alatt mindenkit megmentettek, vagy letakartak. Az kemény lehet mondtam csak rá úgy egykedvűen, valamit mégiscsak reagálni kellett. Áh, megszokja az ember, jött a gyors határozott talán begyakorolt válasz.</p>", "<p>Na ezt nem szerettem. Nem azért, amit mondott. Hanem ahogy. Nyugodtan. Túl nyugodtan, higgadtan, már-már hidegvérűen. Én egy döglött galambot sem tudok megszokni az út szélén. Kikerülöm, aztán még kétszáz méter múlva is arra gondolok, hogy reggel az a galamb még valószínűleg teljesen normális galambügyeket intézett, aztán elcsapták, vagy levadászta egy macska. Ez az ember meg órákig dolgozik nagyon rossz állapotban lévő embereken, aztán hazamegy macaront sütni. Lehet hogy egy pszichopata? Talán tényleg így lehet csak kibírni a stresszes munkákat. Ki tudja</p>", "<p>manapság. Más meg fut, vagy épp iszik, ő meg habzsákból nyomja ki a traumát a tepsire. Tulajdonképpen egészséges megoldás a stresszlevezetésre.</p><p>És nem viszed haza fejben? – kérdeztem, de csak úgy kibuggyant belőlem. Elgondolkodott. Mi a fenén gondolkodik? Kisvártatva megjött a desztillálódott tiszta esszencia válaszként. Az elején hazavittem. Most már ott tudom hagyni.</p>", "<p>Bólintottam. Ez szép, végre egy érett gondolkodású pali. Professzionális. Aztán hozzátette, muszáj különválasztani a munkát attól, ami otthon van. Miért mi van otthon? Megint itt van ez a bizarr légkör körülötte. Valamiért megint ránéztem a kezére. De hülye vagyok, Évának igaza van végre egy normális pali. Egy sebész ül velem szemben. Egy kedves, intelligens, jóképű sebész, aki macaront süt. Ez gyakorlatilag főnyeremény. Éva egyszer az életben eltalálta. Egyébként milyen sebész vagy? – kérdeztem rá konkrétan, itt az idő fellebbenteni a fátylat.</p>", "<p>Megállt a pohár a kezében. Sebész? kérdezte felvonva a szemöldökét. Azt mondtad, valami olyasmi, vágtam rá, kicsit félve. Ha nem az vagy, akkor mi? Borbély? Nevetett egy jót. Én már megint nem.</p><p>Nem vagyok sebész. mondta mikor kicsit lecsendesedett.</p>", "<p>Érdekes, milyen gyorsan tud az emberi agy visszamenőleg újraértékelni egy teljes estét. Összegeztem magamban, amit eddig hallottam tőle. Kézzel szeretek dolgozni. Jól bírom a vért. Engem a belső dolgok érdekelnek. Tudod, hol kell kezdeni, hogyan érdemes hozzáférni. Most már ott tudom hagyni. Önmagukban mind használható infók, mégis félrevittek. Éva. Te rohadt szemét, kit sóztál rám, ha vége van a randinak felhívom és elküldöm melegebb éghajlatra.</p><p>Akkor mégis milyen orvos vagy? Orvos vagy? tettem fel az összegzés eredményét kérdésként.</p>", "<p>Patológus vagyok. Jött az őszinte válasz. Megkönnyebbültem. Annyira, hogy elnevettem magam. Patológus. Hát persze. Patológus. Teljesen rendben van. A patológus orvos. Nem kapkod, megvárják a betegei, nincs műhibaper a nyakában, szabad hétvégék, nincs ügyelet. Kórházban dolgozik, mikroszkóp mellett és még nem szemüveges. Civilizált, kiszámítható, tervezhető dolgok.</p><p>Hogy egészen pontos legyek, igazságügyi orvosszakértő, tette hozzá egy félmondatként.</p>", "<p>Nem tudom, mennyi ideig nézhettem az utolsó mondat hallatán. Talán két másodpercig. Talán húszig. Nem tudom. Ő törte meg a csendet. Boncolok. közölte a rideg valóságot. Igen, erre magamtól is rájöttem, így az infók birtokában. Hirtelen minden mondata megtalálta a helyét. Sajnos. Lenéztem a tányérra. Ott feküdt a macaron másik fele. Tökéletes metszési felszínnel. Kérsz még egyet? kérdezte. Van mandulás is. Mandula vagy mogyoró? Nem mindegy, ki kérdezi jutott eszembe az első gondolatom.</p><p>A sebész vagy a cukrász? A boncmesterre valahogy nem teljesen készültem fel.</p>", "<p>Lelki szemeim előtt tíz évadnyi Helyszinelők sorozat jelent meg, annak minden tudományos és lelki nyűgjével. Végiggondoltam az estét, és arra jutottam, hogy egy próbát megér. Ki tudja hátha érdekes, amit csinál. Kicsit elmosolyodva feltettem a következő kérdést.</p><p>Pisztácia nincs? kérdeztem félve, de azonnal rávágta vigyorogva az egyik kedvenc filmem ikonikus mondatát.</p><p>A pisztácia kifogyott, van vanília, tutti-frutti, karamell, rumos dió és kávé. Csokoládé nem is volt!</p>", "<div class=\"ornament\" style=\"margin-top:45%\">❦</div>"];
const demo=[
"A szobában még ott lebegett a reggeli kávé illata. Az ablakon beszűrődő fény végigsimított a régi bútorokon, mintha valamit keresne. A ház csendje ezúttal nem volt üres: apró neszekkel, elhallgatott mondatokkal és régen megőrzött emlékekkel telt meg.",
"Az asztalon egy megsárgult boríték feküdt. Senki sem tudta pontosan, mikor került oda. A tinta néhol elhalványult, de a betűk még mindig ismerősnek tűntek. Valaki sok évvel korábban gondosan, lassan írhatta őket, talán azért, hogy a mondatoknak legyen idejük megérkezni.",
"Odakint a fák levelei megmozdultak a szélben. A kertkapu halkan megnyikordult, aztán újra csend lett. Az idő különös módon viselkedett ezen a délutánon: ami tegnap történt, távolinak tetszett, ami évtizedekkel ezelőtt, az pedig egészen közelinek.",
"A történet nem ott kezdődött, ahol bárki várta volna. Egy jelentéktelennek látszó mozdulattal kezdődött, egy pillantással, amelyet könnyű lett volna észre sem venni. Csakhogy vannak pillanatok, amelyek utólag egész életünk súlyát magukra veszik.",
"A fiók mélyén egy régi kulcs lapult. A fogai megkoptak, a feje mégis szépen csillogott a délutáni fényben. Nem lehetett tudni, melyik ajtóhoz tartozik, de a kéz, amely megtalálta, azonnal felismerte a súlyát.",
"Az ember olykor nem a választ keresi, hanem a kérdést, amelyet évekkel korábban elmulasztott feltenni. A csöndben most mindkettő helyet kapott. A ház lassan sötétedni kezdett, a falióra pedig egyenletesen számolta tovább a perceket.",
"A távoli utcáról lépések hallatszottak. Közeledtek, majd elhaltak. Egy pillanatra úgy tűnt, valaki megállt az ajtó előtt, de a kilincs nem mozdult. Talán nem is kellett: vannak találkozások, amelyekhez nem szükséges kinyitni semmit.",
"Amikor végül leszállt az este, minden ugyanott maradt. A levél, a kulcs, a csésze az asztalon. Mégis megváltozott valami, amit nem lehetett volna egyetlen mondatban megfogalmazni. A történet talán éppen ezért érdemelte meg, hogy elmeséljék."
];
// A teljes novella szövege a feltöltött Word-dokumentumból, eredeti szövegezéssel.
function pagesFor(index){if(index===0)return samplePages;const offset=index%demo.length;return Array.from({length:16},(_,i)=>{
 if(i===0)return `<div class="ornament">✦ &nbsp; A NOVELLÁK KÖNYVTÁRA &nbsp; ✦</div><h1>${titles[index]}</h1><div class="ornament">❦</div><p>${demo[offset]}</p>`;
 const a=demo[(offset+i)%demo.length],b=demo[(offset+i+3)%demo.length];return `<p>${a}</p><p>${b}</p>`;
});}
let pages=[];
function render(){const mobile=window.matchMedia('(max-width:650px)').matches;const n=mobile?1:2;const idx=spread*n;
 left.innerHTML=pages[idx]||'';right.innerHTML=pages[idx+1]||'';
 left.scrollTop=0;right.scrollTop=0;
 document.getElementById('leftNumber').textContent=idx+1<=pages.length?idx+1:'';
 document.getElementById('rightNumber').textContent=idx+2<=pages.length?idx+2:'';
 document.getElementById('pageStatus').textContent=mobile?`${idx+1} / ${pages.length} oldal`:`${idx+1}–${Math.min(idx+2,pages.length)} / ${pages.length} oldal`;
 const prev=idx===0,next=idx+n>=pages.length;
 for(const id of ['prev','edgePrev'])document.getElementById(id).disabled=prev;
 for(const id of ['next','edgeNext'])document.getElementById(id).disabled=next;
}
function turn(direction){
 if(turning)return;
 const mobile=window.matchMedia('(max-width:650px)').matches;
 const n=mobile?1:2;
 if((direction<0&&spread===0)||(direction>0&&(spread+1)*n>=pages.length))return;
 turning=true;
 const idx=spread*n, nextIdx=(spread+direction)*n;
 const from=direction>0?(mobile?idx:idx+1):idx;
 const to=direction>0?nextIdx:(mobile?nextIdx:nextIdx+1);
 const sheet=document.createElement('div');
 sheet.className='storybook-sheet '+(direction>0?'forward':'backward');
 for(const [side,pageNo] of [['front',from],['back',to]]){
   const face=document.createElement('div');face.className='storybook-face '+side;
   face.innerHTML='<div class="page-content">'+(pages[pageNo]||'')+'</div><div class="page-number">'+(pageNo+1)+'</div>';
   sheet.appendChild(face);
 }
 book.appendChild(sheet);
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const duration=reduce?40:1850;
 const start=performance.now();let switched=false;
 const ease=t=>t*t*(3-2*t);
 function frame(now){
   if(!sheet.isConnected){turning=false;return}
   const t=Math.min(1,(now-start)/duration),q=ease(t);
   const arch=Math.pow(Math.sin(Math.PI*q),1.35);
   const angle=(direction>0?-180:180)*q;
   // Egyetlen, összefüggő papírlap: lágy ív és apró lebbenés.
   const curve=1-.022*arch;
   const flutter=0;
   sheet.style.transform=`rotateY(${angle}deg) scaleX(${curve})`;
   sheet.style.setProperty('--paper-arch',arch.toFixed(3));
   if(!switched&&q>=.5){switched=true;spread+=direction;render()}
   if(t<1)requestAnimationFrame(frame);
   else{if(!switched){spread+=direction;render()}sheet.remove();turning=false}
 }
 requestAnimationFrame(frame);
}

function showTip(e,g){tip.textContent=titles[Number(g.dataset.i)];tip.classList.add('on');moveTip(e)}
function moveTip(e){const x=Math.min(e.clientX+18,window.innerWidth-230),y=Math.max(12,e.clientY-52);tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'}
function hideTip(){tip.classList.remove('on')}
function openBook(g){setCatalog(false);last=g;current=Number(g.dataset.i);pages=pagesFor(current);spread=0;hideTip();reader.classList.add('open');render();document.getElementById('next').focus()}
for(const g of document.querySelectorAll('.spine')){g.addEventListener('mouseenter',e=>showTip(e,g));g.addEventListener('mousemove',moveTip);g.addEventListener('mouseleave',hideTip);g.addEventListener('click',()=>openBook(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook(g)}})}
function closeBook(){reader.classList.remove('open');book.querySelectorAll('.flip-sheet,.wind-sheet,.storybook-sheet').forEach(x=>x.remove());turning=false;last?.focus()}
for(const id of ['close','exit'])document.getElementById(id).addEventListener('click',closeBook);
for(const id of ['next','edgeNext'])document.getElementById(id).addEventListener('click',()=>turn(1));
for(const id of ['prev','edgePrev'])document.getElementById(id).addEventListener('click',()=>turn(-1));
document.addEventListener('keydown',e=>{if(!reader.classList.contains('open'))return;if(e.key==='Escape')closeBook();if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});
window.addEventListener('resize',()=>{if(reader.classList.contains('open')){spread=0;render()}});

// A katalógus működő bemutatója; a polccímkék a tervezett tartományokat jelzik.
const catalogToggle=document.getElementById('catalogToggle');
const catalogPanel=document.getElementById('catalog');
function setCatalog(open){catalogPanel.classList.toggle('is-visible',open);catalogToggle.setAttribute('aria-expanded',String(open));if(open)document.getElementById('catalogNumber').focus()}
catalogToggle.addEventListener('click',()=>setCatalog(!catalogPanel.classList.contains('is-visible')));
document.addEventListener('pointerdown',e=>{if(catalogPanel.classList.contains('is-visible')&&!catalogPanel.contains(e.target)&&!catalogToggle.contains(e.target))setCatalog(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&catalogPanel.classList.contains('is-visible'))setCatalog(false)});
const catalogForm=document.getElementById('catalogForm');
const catalogInput=document.getElementById('catalogNumber');
const catalogResult=document.getElementById('catalogResult');
const catalogOpen=document.getElementById('catalogOpen');
let selectedCatalog=null;
const ranges=[[1,25,'001–025'],[26,50,'026–050'],[51,75,'051–075'],[76,100,'076–100'],[101,140,'101–140'],[141,150,'Újdonságok · 141–150']];
function locateNovel(n){
 document.querySelectorAll('.spine').forEach(g=>g.classList.remove('catalog-highlight'));
 const range=ranges.find(r=>n>=r[0]&&n<=r[1]);
 if(!range){catalogResult.textContent='Adj meg egy sorszámot 1 és 150 között.';catalogOpen.classList.remove('show');return}
 selectedCatalog=n;
 const title=n===42?'Mandula vagy mogyoró?':`A ${String(n).padStart(3,'0')}. novella`;
 catalogResult.innerHTML=`<strong>${String(n).padStart(3,'0')}.</strong> ${title}<br>Helye: <strong>${range[2]}</strong> polc`;
 catalogOpen.classList.add('show');
 // A látványtervben nyolc eredeti gerinc kattintható; a többi sorszám katalóguson át nyitható.
 const spine=document.querySelectorAll('.spine')[n>=141?n-141:-1];
 if(spine)spine.classList.add('catalog-highlight');
}
catalogForm.addEventListener('submit',e=>{e.preventDefault();locateNovel(Number(catalogInput.value))});
catalogOpen.addEventListener('click',()=>{if(selectedCatalog===null)return;const g=document.querySelector('.spine');if(!g)return;openBook(g);current=selectedCatalog===42?0:selectedCatalog%8;pages=selectedCatalog===42?samplePages:pagesFor(current);spread=0;render()});

<script>
const apiState={novels:[],selected:null};
const escText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function novelPages(novel){
 const chunks=[];const max=880;
 for(const p of novel.paragraphs){
  const t=String(p||'').trim();if(!t)continue;
  const words=t.split(/\s+/);let part='';
  for(const word of words){if(part && (part+' '+word).length>max){chunks.push(part);part=word}else part+=(part?' ':'')+word}
  if(part)chunks.push(part);
 }
 const out=[`<div class="ornament">✦ &nbsp; ${String(novel.number).padStart(3,'0')} &nbsp; ✦</div><h1>${escText(novel.title)}</h1>`];
 for(const t of chunks)out.push(`<p>${escText(t)}</p>`);
 // Repack paragraphs into pages; conservative length avoids overflows in the original antique reader.
 const result=[];let page=out[0];let len=0;
 for(const p of out.slice(1)){const plain=p.replace(/<[^>]+>/g,'');if(len+plain.length>780&&len){result.push(page);page='';len=0}page+=p;len+=plain.length}
 if(page)result.push(page);
 return result;
}
function openNovel(novel){
 if(!novel)return;
 setCatalog(false);hideTip();pages=novelPages(novel);spread=0;
 reader.classList.add('open');render();document.getElementById('next').focus();
}
function getNovelByNumber(n){return apiState.novels.find(x=>x.number===n)}
function refreshSlots(){
 const sorted=[...apiState.novels].sort((a,b)=>b.number-a.number).slice(0,10).reverse();
 document.querySelectorAll('.spine').forEach((g,i)=>{
   const novel=sorted[i];g.dataset.novelNumber=novel?novel.number:'';
   g.setAttribute('aria-label',novel?`${novel.number}. ${novel.title}`:'Üres könyvhely');
   g.style.opacity=novel?'1':'.35';
 });
 const status=document.getElementById('siteStatus');
 status.innerHTML=`${apiState.novels.length} novella · <a href="/admin">Szerzői belépés</a>`;
 catalogInput.max=Math.max(1,...apiState.novels.map(x=>x.number));
}
// Capture listeners prevent the old sample-story handlers from opening demo content.
for(const g of document.querySelectorAll('.spine')){
 g.addEventListener('click',e=>{e.stopImmediatePropagation();openNovel(getNovelByNumber(Number(g.dataset.novelNumber)))},true);
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.stopImmediatePropagation();e.preventDefault();openNovel(getNovelByNumber(Number(g.dataset.novelNumber)))}},true);
 g.addEventListener('mouseenter',e=>{e.stopImmediatePropagation();const n=getNovelByNumber(Number(g.dataset.novelNumber));hideTip();if(n){tip.textContent=`${String(n.number).padStart(3,'0')}. ${n.title}`;tip.classList.add('on');moveTip(e)}},true);
}
catalogForm.addEventListener('submit',e=>{
 e.preventDefault();e.stopImmediatePropagation();const n=Number(catalogInput.value);const novel=getNovelByNumber(n);apiState.selected=novel;
 if(!novel){catalogResult.textContent='Ehhez a sorszámhoz még nincs feltöltött novella.';catalogOpen.classList.remove('show');return}
 const latest=[...apiState.novels].sort((a,b)=>b.number-a.number).slice(0,10).some(x=>x.number===n);
 const shelf=latest?'Újdonságok':`${String(Math.floor((n-1)/25)*25+1).padStart(3,'0')}–${String(Math.floor((n-1)/25)*25+25).padStart(3,'0')}`;
 catalogResult.innerHTML=`<strong>${String(n).padStart(3,'0')}.</strong> ${escText(novel.title)}<br>Helye: <strong>${shelf}</strong>`;
 catalogOpen.classList.add('show');
 document.querySelectorAll('.spine').forEach(g=>g.classList.toggle('catalog-highlight',Number(g.dataset.novelNumber)===n));
},true);
catalogOpen.addEventListener('click',e=>{e.stopImmediatePropagation();openNovel(apiState.selected)},true);
fetch('novellak.json').then(r=>r.json()).then(data=>{apiState.novels=data;refreshSlots()}).catch(()=>{document.getElementById('siteStatus').textContent='A szerver nem érhető el.'});
</script><style>

<script>
// Positions in original 1534 x 960 image coordinates, mapped through SVG viewBox.
// Book rectangles remain proportional on screen resizing.
(function(){
 const stage=document.querySelector('.stage');if(!stage)return;
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('id','allBookHotspots');svg.setAttribute('viewBox','0 0 1534 960');svg.setAttribute('preserveAspectRatio','xMidYMid meet');svg.setAttribute('aria-label','Kattintható könyvgerincek');
 stage.appendChild(svg);
 const layout=[
  {kind:'latest',x:32,y:187,w:384,h:123,capacity:10},
  {start:1,end:25,x:489,y:185,w:552,h:126},
  {start:26,end:50,x:31,y:368,w:389,h:115},
  {start:51,end:75,x:489,y:367,w:554,h:117},
  {start:76,end:100,x:30,y:553,w:391,h:148},
  {start:101,end:140,x:488,y:551,w:555,h:149}
 ];
 function addSlot(n,x,y,w,h){
  const g=document.createElementNS(ns,'g');g.dataset.number=n;
  const rect=document.createElementNS(ns,'rect');rect.setAttribute('class','bookslot');rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width',w);rect.setAttribute('height',h);rect.setAttribute('tabindex','0');rect.setAttribute('role','button');
  const mark=document.createElementNS(ns,'rect');mark.setAttribute('class','bookmark');mark.setAttribute('x',x+Math.max(1,w*.18));mark.setAttribute('y',y+2);mark.setAttribute('width',Math.max(3,w*.55));mark.setAttribute('height',3.2);
  g.append(rect,mark);svg.appendChild(g);
  const show=e=>{const novel=window.libraryNovels?.find(a=>a.number===n);if(!novel)return;const t=document.querySelector('.tip');if(!t)return;t.textContent=String(n).padStart(3,'0')+'. '+novel.title;t.classList.add('on');const pos=e.clientX===undefined?rect.getBoundingClientRect():{left:e.clientX,top:e.clientY};t.style.left=Math.min(window.innerWidth-260,(pos.left||0)+12)+'px';t.style.top=Math.max(12,(pos.top||0)-45)+'px'};
  rect.addEventListener('mouseenter',show);rect.addEventListener('mousemove',show);
  rect.addEventListener('mouseleave',()=>document.querySelector('.tip')?.classList.remove('on'));
  rect.addEventListener('focus',show);rect.addEventListener('blur',()=>document.querySelector('.tip')?.classList.remove('on'));
  const open=()=>{const novel=window.libraryNovels?.find(a=>a.number===n);if(novel)openNovel(novel)};
  rect.addEventListener('click',open);rect.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  return g;
 }
 const slots=[];
 for(const row of layout){
  const count=row.capacity||row.end-row.start+1;
  for(let i=0;i<count;i++){
   const w=row.w/count, x=row.x+i*w;
   slots.push({g:addSlot(0,x+1,row.y+3,Math.max(6,w-2),row.h-7),row,index:i});
  }
 }
 function update(){
  const all=window.libraryNovels||[];const sorted=[...all].sort((a,b)=>a.number-b.number);
  const latest=sorted.slice(-10);const archived=sorted.slice(0,-10);
  for(const slot of slots){
   const {row,index,g}=slot;
   const novel=row.kind==='latest'?latest[index]:archived.filter(n=>n.number>=row.start&&n.number<=row.end)[index];
   const n=novel?.number||0;g.dataset.number=n;
   const rect=g.querySelector('.bookslot');rect.setAttribute('aria-label',novel?`${String(n).padStart(3,'0')}. ${novel.title}`:'Üres könyvhely');
   g.style.display=novel?'':'none';
   // Listeners resolve the number from the group dynamically.
  }
 }
 // Event listeners above are bound at creation, so route interactions via live group number.
 for(const g of svg.children){
  const rect=g.querySelector('.bookslot');
  const fresh=rect.cloneNode(true);rect.replaceWith(fresh);
  const get=()=>window.libraryNovels?.find(a=>a.number===Number(g.dataset.number));
  const tip=document.querySelector('.tip');
  function show(e){const n=get();if(!n||!tip)return;tip.textContent=`${String(n.number).padStart(3,'0')}. ${n.title}`;tip.classList.add('on');const r=fresh.getBoundingClientRect();tip.style.left=Math.min(window.innerWidth-250,r.left+10)+'px';tip.style.top=Math.max(10,r.top-42)+'px'}
  fresh.addEventListener('mouseenter',show);fresh.addEventListener('focus',show);
  fresh.addEventListener('mouseleave',()=>tip?.classList.remove('on'));fresh.addEventListener('blur',()=>tip?.classList.remove('on'));
  fresh.addEventListener('click',()=>{const n=get();if(n)openNovel(n)});
  fresh.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const n=get();if(n)openNovel(n)}});
 }
 window.updateBookSlots=update;
 // Poll only until initial API request resolves; later changes arrive on page reload.
 fetch('novellak.json').then(r=>r.json()).then(data=>{window.libraryNovels=data;update();}).catch(()=>{});
 // Make search highlight the exact mapped spine.
 const form=document.getElementById('catalogForm');
 form?.addEventListener('submit',()=>{setTimeout(()=>{const n=Number(document.getElementById('catalogNumber').value);for(const g of svg.children)g.querySelector('.bookslot').classList.toggle('highlight',Number(g.dataset.number)===n)},0)});
})();
</script></body></html>
